<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Catálogo de Vinilos de Jaime González Cáceres</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo-container">
    <img src="images/logo.png" alt="Logo Caicura" class="main-logo">
  </div>
  <h1>Catálogo de Vinilos</h1>
  <p>Colección personal de Jaime González Cáceres</p>
</header>

  <section class="search-section">
    <input type="text" id="search-input" placeholder="Buscar disco o artista...">
    <button id="btn-toggle-filtros">Filtrar y Ordenar ▼</button>
  </section>

  <section id="filtros-panel" class="filtros-panel oculto">
    <div class="filtros-grid">
      <div>
        <label>Artista:</label>
        <select id="filter-artista"></select>
      </div>
      <div>
        <label>Década:</label>
        <select id="filter-decada"></select>
      </div>
      <div>
        <label>Género:</label>
        <select id="filter-genero"></select>
      </div>
      <div>
        <label>Ordenar por:</label>
        <select id="sort-select">
          <option value="default">Por defecto (A-Z)</option>
          <option value="artista-za">Artista (Z a la A)</option>
          <option value="titulo-az">Título (A a la Z)</option>
          <option value="anio-asc">Año (Antiguo a Nuevo)</option>
          <option value="anio-desc">Año (Nuevo a Antiguo)</option>
        </select>
      </div>
    </div>
    <div class="limpiar-container">
       <button id="btn-limpiar" title="Limpiar todos los filtros">✖ Limpiar Filtros</button>
    </div>
  </section>

  <div class="contador-container">
    <p id="contador-vinilos"></p>
  </div>

  <section id="vinilos-container"></section>

  <div id="modal-detalle" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div id="modal-body-content">
      </div>
    </div>
  </div>

  <footer>
    <p><strong>Caicura's Vinyls</strong></p>
    <p>Catálogo de la colección personal de Jaime González Cáceres.</p>
    <p>&copy; 2026</p>
  </footer>

  <button id="btn-subir" title="Volver arriba">↑</button>

  <script src="script.js"></script>

</body>
</html>
